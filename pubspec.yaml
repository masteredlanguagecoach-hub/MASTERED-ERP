name: mastered_erp
description: MASTERED ERP - Academy Management System (CRM, Fee Collection, Accounting)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  http: ^1.2.1

  # Local Storage & Preferences
  shared_preferences: ^2.2.3

  # Formatting & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6

  # Data Visualization & Charts
  fl_chart: ^0.68.0

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.13.1

  # UI Elements & Icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
